<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vòng quay 16 nhân viên</title>
<style>
:root{--bg:#fff7e6;--fg:#3b1d00;--card:#fff;--line:#e8d3a8;--accent:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1409;--fg:#ffeccc;--card:#2b1e10;--line:#5a4120;--accent:#e74c3c}}
:root[data-theme="dark"]{--bg:#1d1409;--fg:#ffeccc;--card:#2b1e10;--line:#5a4120;--accent:#e74c3c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
h1{font-size:1.5rem;margin:16px 8px 4px}
.wrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start;padding:12px}
.stage{position:relative;width:min(92vw,520px)}
canvas{width:100%;height:auto;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--accent);filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 28px;background:var(--accent);color:#fff;cursor:pointer;margin-top:12px}
button:disabled{opacity:.5;cursor:default}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line);padding:8px 16px;font-weight:500}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;width:min(92vw,300px);text-align:left}
.panel h2{font-size:1rem;margin:0 0 8px}
textarea{width:100%;height:300px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.hint{font-size:.8rem;opacity:.75;margin:6px 0}
#hist{margin:8px 0 0;padding-left:20px;font-size:.9rem}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9}
#modal .box{background:var(--card);border-radius:16px;padding:28px 36px;max-width:90vw}
#modal .name{font-size:2rem;font-weight:800;color:var(--accent);margin:8px 0 4px;word-break:break-word}
</style></head><body>
<h1>🎡 Chiếc nón kỳ diệu – 16 nhân viên</h1>
<div class="hint">Mỗi người có xác suất bằng nhau (1/16)</div>
<div class="wrap">
 <div>
  <div class="stage"><canvas id="c" width="800" height="800"></canvas><div class="pointer"></div></div>
  <button id="spin">QUAY</button>
  <div style="margin-top:10px"><button class="sec" id="mute">🔊 Nhạc: Bật</button>
  <label class="sec" style="display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.9rem">🎵 Chọn file nhạc (mp3)<input type="file" id="mp3" accept="audio/*" hidden></label>
  <div class="hint" id="musicInfo">Đang dùng nhạc mặc định</div></div>
 </div>
 <div class="panel">
  <h2>Danh sách (mỗi dòng 1 tên)</h2>
  <textarea id="names"></textarea>
  <div class="hint">Sửa tên rồi bấm "Cập nhật". Số dòng = số ô trên vòng.</div>
  <label class="hint"><input type="checkbox" id="rm"> Người đã trúng thì bỏ khỏi vòng</label><br>
  <button class="sec" id="apply">Cập nhật</button>
  <button class="sec" id="reset">Khôi phục 16 tên</button>
  <h2 style="margin-top:12px">Lịch sử</h2>
  <ol id="hist"></ol>
 </div>
</div>
<div id="modal"><div class="box"><div>🎉 Người được chọn</div><div class="name" id="win"></div><button id="ok">Đóng</button></div></div>
<script>
var def=["Huỳnh Thị Phi Diễm","Hồ Văn Đạt","Cao Minh Sang","Trần Ngọc Hậu","Hồ Văn Trung","Nguyễn Đức Huy","Trần Thị Mến","Đỗ Kim Bình","Bùi Chí Tuấn","Lê Hồng Sơn","Đặng Quốc Việt","Huỳnh Thị Xuân Tình","Trần Kim Bé","Lê Thị Xuân","Cao Tấn Trưởng","Phan Thị Kim Liên"];
var hl=-1,flash=false,AC=null,musicOn=true,bgTimer=null,bgSrc=null,customBuf=null,step=0;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)()}if(AC.state==="suspended")AC.resume();return AC}
function note(f,t,d,type,v){var c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type||"triangle";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.15,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.02)}
function tick(){if(!musicOn)return;note(1400,ac().currentTime,0.05,"square",0.05)}
var mel=[523,659,784,659,880,784,659,523,587,740,880,740,988,880,740,587];
function startMusic(){if(!musicOn)return;var c=ac();
 if(customBuf){bgSrc=c.createBufferSource();bgSrc.buffer=customBuf;bgSrc.loop=true;bgSrc.connect(c.destination);bgSrc.start();return}
 step=0;var next=c.currentTime+0.05;
 bgTimer=setInterval(function(){while(next<c.currentTime+0.3){note(mel[step%16],next,0.2,"triangle",0.12);if(step%2===0)note(mel[step%16]/4,next,0.25,"sine",0.12);step++;next+=0.17}},80)}
function stopMusic(){clearInterval(bgTimer);bgTimer=null;if(bgSrc){try{bgSrc.stop()}catch(e){}bgSrc=null}}
function fanfare(){if(!musicOn)return;var t=ac().currentTime;[523,659,784,1047,784,1047,1319].forEach(function(f,i){note(f,t+i*0.14,0.3,"sawtooth",0.1)})}
function under(){var n=names.length,a=2*Math.PI/n;var x=((-Math.PI/2-angle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);return Math.floor(x/a)%n}
var names=def.slice(),angle=0,spinning=false;
var cv=document.getElementById("c"),ctx=cv.getContext("2d");
var cols=["#e74c3c","#f39c12","#27ae60","#2980b9","#8e44ad","#16a085","#d35400","#c0392b"];
function draw(){
 var n=names.length,S=cv.width,c=S/2,r=c-10,a=2*Math.PI/n;
 ctx.clearRect(0,0,S,S);
 for(var i=0;i<n;i++){
  var s=angle+i*a;
  ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,s,s+a);ctx.closePath();
  ctx.fillStyle=(i===hl&&flash)?"#ffe600":cols[i%cols.length];ctx.fill();
  ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();
  ctx.save();ctx.translate(c,c);ctx.rotate(s+a/2);
  ctx.fillStyle=(i===hl&&flash)?"#7a1f00":"#fff";ctx.textAlign="right";ctx.textBaseline="middle";
  ctx.font="bold "+Math.max(14,Math.min(30,260/n*1.6))+"px sans-serif";
  var t=names[i].trim().split(/\s+/).slice(-2).join(" ");
  ctx.fillText(t,r-18,0);ctx.restore();
 }
 ctx.beginPath();ctx.arc(c,c,34,0,7);ctx.fillStyle="#fff";ctx.fill();
 ctx.lineWidth=6;ctx.strokeStyle="#c0392b";ctx.stroke();
}
function spin(){
 if(spinning||names.length<2)return;
 spinning=true;hl=-1;flash=false;document.getElementById("spin").disabled=true;
 var n=names.length,a=2*Math.PI/n;
 var idx;
 if(window.crypto&&crypto.getRandomValues){var u=new Uint32Array(1);crypto.getRandomValues(u);idx=u[0]%n}else idx=Math.floor(Math.random()*n);
 // pointer at top (-90deg): slice idx center must land at -PI/2
 var jitter=(Math.random()-.5)*a*.8;
 var target=-Math.PI/2-(idx*a+a/2)+jitter;
 var cur=((angle%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
 var t2=((target%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
 var delta=t2-cur;if(delta<0)delta+=2*Math.PI;
 var total=delta+2*Math.PI*(14+Math.floor(Math.random()*3));
 var start=angle,dur=25000,t0=performance.now(),lastK=under();startMusic();
 function f(now){
  var p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
  angle=start+total*e;draw();var k=under();if(k!==lastK){lastK=k;tick()}
  if(p<1)requestAnimationFrame(f);else done(idx);
 }
 requestAnimationFrame(f);
}
function done(idx){
 spinning=false;document.getElementById("spin").disabled=false;stopMusic();fanfare();hl=idx;var fc=0;var fi=setInterval(function(){flash=!flash;draw();if(++fc>=10){clearInterval(fi);flash=true;draw()}},220);
 var w=names[idx];
 document.getElementById("win").textContent=w;
 setTimeout(function(){document.getElementById("modal").style.display="flex"},1800);
 var li=document.createElement("li");li.textContent=w;
 var h=document.getElementById("hist");h.insertBefore(li,h.firstChild);
 if(document.getElementById("rm").checked&&names.length>2){
  setTimeout(function(){hl=-1;flash=false;names.splice(idx,1);document.getElementById("names").value=names.join("\n");draw()},2400);
 }
}
function apply(){
 var l=document.getElementById("names").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
 if(l.length<2){alert("Cần ít nhất 2 tên");return}
 names=l;draw();
}
document.getElementById("spin").onclick=spin;
document.getElementById("mute").onclick=function(){musicOn=!musicOn;this.textContent=musicOn?"🔊 Nhạc: Bật":"🔇 Nhạc: Tắt";if(!musicOn)stopMusic()};
document.getElementById("mp3").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){ac().decodeAudioData(r.result,function(b){customBuf=b;document.getElementById("musicInfo").textContent="Đang dùng: "+f.name},function(){document.getElementById("musicInfo").textContent="Không đọc được file này"})};r.readAsArrayBuffer(f)};
document.getElementById("apply").onclick=apply;
document.getElementById("reset").onclick=function(){names=def.slice();document.getElementById("names").value=names.join("\n");draw()};
document.getElementById("ok").onclick=function(){document.getElementById("modal").style.display="none"};
document.getElementById("names").value=names.join("\n");
draw();
</script></body></html>
